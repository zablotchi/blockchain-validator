[package]
name = "checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dag.workspace = true
execution.workspace = true
serde.workspace = true
tracing.workspace = true

[features]
test-utils = ["dag/test-utils", "execution/test-utils"]
# Records every decision for tests to compare. Not in `test-utils`, which the certifier bench
# turns on: the bench measures the certifier without it.
decision-log = []

[dev-dependencies]
# Self-dependency turning on the gated test constructors for the bench targets.
checkpoint = { workspace = true, features = ["test-utils"] }
criterion.workspace = true
dag = { workspace = true, features = ["test-utils"] }
execution = { workspace = true, features = ["test-utils"] }

[[bench]]
name = "certifier"
harness = false
